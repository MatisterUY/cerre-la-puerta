name: Importar proyecto
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/importar.yml'

jobs:
  importar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: |
          unzip -o cerre-la-puerta-completo.zip -d .
          rm cerre-la-puerta-completo.zip
      - name: Guardar archivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Importar proyecto completo"
          git push
